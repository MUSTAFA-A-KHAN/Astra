<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story assets</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14181b; color: #e8e2d4; font: 13px/1.3 system-ui, sans-serif; }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); }
  .cell { position: relative; aspect-ratio: 4 / 3; border: 1px solid #262c30; }
  .cell b { display: block; font-size: 14px; }
  .cell p { position: absolute; z-index: 1; left: 8px; bottom: 6px; margin: 0; text-shadow: 0 1px 3px #000; pointer-events: none; }
  body.single #grid { grid-template-columns: 1fr; }
  .cell.error p { color: #ff8a7a; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
<script type="importmap">{"imports":{"three":"../../vendor/three/three.module.js","three/addons/":"../../vendor/three/addons/"}}</script>
</head>
<body>
<div id="grid"></div>
<script type="module">
// Shows every story model at once, each framed in its own cell with its first
// animation playing, and reports what loaded on window.__STORY_PREVIEW__.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const ALL = ['moonwell-well', 'moonwell-stone-circle', 'moonwell-ghost-stag', 'moonwell-keeper', 'light-shard', 'restless-wisp', 'harbour-villager', 'wanderers-campfire', 'wanderers-tent', 'sunstone-watchtower', 'harbour-rowboat', 'harbour-mythic-whale', 'lore-book', 'quest-notice-board', 'old-lantern', 'treasure-chest'];
// ?only=name,name shows just those models; ?from=dir loads them from another folder,
// such as the Sketchfab originals, by the same names.
const params = new URLSearchParams(location.search), from = params.get('from') || '.';
const MODELS = params.get('only')?.split(',') ?? ALL;
if (MODELS.length === 1) document.body.classList.add('single');
// The clip each model is shown with, where the first is not the telling one.
const CLIP = { 'restless-wisp': /Idle$/, 'treasure-chest': /Open$/ };

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setScissorTest(true);
document.body.append(renderer.domElement);
const grid = document.getElementById('grid'), loader = new GLTFLoader(), clock = new THREE.Clock();
const report = { ready: false, models: [] };
window.__STORY_PREVIEW__ = report;

const cells = await Promise.all(MODELS.map(async name => {
  const element = document.createElement('div'), label = document.createElement('p');
  element.className = 'cell'; element.append(label); grid.append(element);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(35, 4 / 3, .01, 1000);
  scene.background = new THREE.Color('#1c2226');
  scene.add(new THREE.HemisphereLight('#dfe8ff', '#3a3226', 2.2));
  const sun = new THREE.DirectionalLight('#fff4e0', 2.4); sun.position.set(3, 5, 4); scene.add(sun);
  try {
    const bytes = (await (await fetch(`${from}/${name}.glb`, { method: 'HEAD' })).headers.get('content-length')) | 0;
    const gltf = await loader.loadAsync(`${from}/${name}.glb`);
    const model = gltf.scene; scene.add(model);
    let triangles = 0, untextured = 0, skinned = false;
    model.traverse(object => {
      if (!object.isMesh) return;
      skinned ||= object.isSkinnedMesh;
      const index = object.geometry.index;
      triangles += (index ? index.count : object.geometry.attributes.position.count) / 3;
      for (const material of [object.material].flat()) if (!material.map && !material.emissiveMap) untextured++;
    });
    const clip = gltf.animations.find(c => CLIP[name]?.test(c.name)) || gltf.animations[0];
    const mixer = clip ? new THREE.AnimationMixer(model) : null;
    mixer?.clipAction(clip).play();
    const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    const radius = size.length() / 2 || 1;
    camera.position.copy(center).add(new THREE.Vector3(.9, .55, 1.1).normalize().multiplyScalar(radius / Math.sin(THREE.MathUtils.degToRad(17.5))));
    camera.near = radius / 100; camera.far = radius * 100; camera.updateProjectionMatrix(); camera.lookAt(center);
    const entry = { name, ok: true, megabytes: +(bytes / 1e6).toFixed(2), triangles: Math.round(triangles), skinned, untextured, clips: gltf.animations.map(c => `${c.name} ${c.duration.toFixed(1)}s`), size: size.toArray().map(v => +v.toFixed(2)) };
    report.models.push(entry);
    label.innerHTML = `<b>${name}</b>${entry.triangles.toLocaleString()} tris · ${entry.megabytes} MB${clip ? ` · ▶ ${clip.name.replace(/^.*\|/, '')}` : ''}`;
    return { element, scene, camera, mixer, center };
  } catch (error) {
    element.classList.add('error'); label.innerHTML = `<b>${name}</b>${error.message}`;
    report.models.push({ name, ok: false, error: String(error.message || error) });
    return { element, scene, camera };
  }
}));

function frame() {
  const dt = clock.getDelta();
  renderer.setSize(innerWidth, innerHeight, false);
  for (const cell of cells) {
    const r = cell.element.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight) continue;
    cell.mixer?.update(dt);
    if (cell.center) {
      // A slow turn round the model, so its sides are seen too.
      const offset = cell.camera.position.clone().sub(cell.center).applyAxisAngle(THREE.Object3D.DEFAULT_UP, dt * .25);
      cell.camera.position.copy(cell.center).add(offset); cell.camera.lookAt(cell.center);
    }
    const y = innerHeight - r.bottom;
    renderer.setViewport(r.left, y, r.width, r.height); renderer.setScissor(r.left, y, r.width, r.height);
    renderer.render(cell.scene, cell.camera);
  }
  requestAnimationFrame(frame);
}
report.ready = true;
frame();
</script>
</body>
</html>
